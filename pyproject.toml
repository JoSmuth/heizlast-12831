[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heizlast-12831"
version = "0.1.0"
description = "Heizlastberechnung nach DIN EN 12831-1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
web = ["fastapi>=0.100", "uvicorn>=0.23", "jinja2>=3.1"]

[project.scripts]
heizlast = "heizlast.cli:main"
heizlast-web = "heizlast.web.app:run_server"
